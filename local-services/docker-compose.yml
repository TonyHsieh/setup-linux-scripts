networks:
  local-mesh:
    driver: bridge

services:
  # 🚦 Traefik v3 Ingress Reverse Proxy
  traefik:
    image: docker.io/library/traefik:v3.0
    container_name: traefik-ingress
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"       # Standard HTTP (http://app.localhost - no port number needed!)
      - "443:443"     # Standard HTTPS (https://app.localhost - no port number needed!)
      - "8088:8080"   # Traefik Dashboard (http://traefik.localhost:8088 or http://traefik.localhost)
    volumes:
      - "${DOCKER_SOCK:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro"
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/certs:/certs:ro"
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    networks:
      - local-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web,websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "io.containers.autoupdate=registry"

  # 📄 BentoPDF - Privacy-First Local PDF Toolkit UI
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    restart: unless-stopped
    networks:
      - local-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bentopdf.rule=Host(`pdf.localhost`)"
      - "traefik.http.routers.bentopdf.entrypoints=web,websecure"
      - "traefik.http.routers.bentopdf.tls=true"
      - "traefik.http.services.bentopdf.loadbalancer.server.port=8080"
      - "io.containers.autoupdate=registry"


  # 🐘 PostgreSQL Database (Local Dev Storage)
  local-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - local-mesh
    ports:
      - "5432:5432"

  # 🦙 Ollama Local LLM Inference Engine (On-Demand)
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: local-ollama
    restart: unless-stopped
    profiles: ["llm", "all"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - local-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.localhost`)"
      - "traefik.http.routers.ollama.entrypoints=web,websecure"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
      - "io.containers.autoupdate=registry"

  # 💬 Open WebUI - ChatGPT-Style Web Interface for Ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: local-open-webui
    restart: unless-stopped
    profiles: ["llm", "webui", "all"]
    environment:
      - OLLAMA_BASE_URL=http://local-ollama:11434
      - WEBUI_AUTH=false
      - WEBUI_NAME=Local AI Hub
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - local-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`chat.localhost`)"
      - "traefik.http.routers.webui.entrypoints=web,websecure"
      - "traefik.http.routers.webui.tls=true"
      - "traefik.http.services.webui.loadbalancer.server.port=8080"
      - "io.containers.autoupdate=registry"

  # 📚 Ubooquity 3 E-Book & Comic Server (Folder-Preserving Reader)
  ubooquity:
    image: lscr.io/linuxserver/ubooquity:latest
    container_name: local-ubooquity
    restart: unless-stopped
    profiles: ["apps", "books", "all"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ubooquity-data:/config
      - "${BOOKS_DIR:-$HOME/Books}:/books:ro"
      - "${BOOKS_DIR_2:-${BOOKS_DIR:-$HOME/Books}}:/books2:ro"
      - "${BOOKS_DIR_3:-${BOOKS_DIR:-$HOME/Books}}:/books3:ro"
      - "${COMICS_DIR:-${BOOKS_DIR:-$HOME/Books}}:/comics:ro"
    ports:
      - "127.0.0.1:2202:2202"
      - "127.0.0.1:2203:2203"
    networks:
      - local-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ubooquity.rule=Host(`books.localhost`) || Host(`ubooquity.localhost`)"
      - "traefik.http.routers.ubooquity.entrypoints=web,websecure"
      - "traefik.http.routers.ubooquity.tls=true"
      - "traefik.http.services.ubooquity.loadbalancer.server.port=2202"
      - "traefik.http.routers.ubooquity-admin.rule=Host(`books-admin.localhost`)"
      - "traefik.http.routers.ubooquity-admin.entrypoints=web,websecure"
      - "traefik.http.routers.ubooquity-admin.tls=true"
      - "traefik.http.services.ubooquity-admin.loadbalancer.server.port=2203"
      - "io.containers.autoupdate=registry"

  # 🎬 Plex Media Server (On-Demand)
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: local-plex
    restart: unless-stopped
    profiles: ["media", "all"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - VERSION=docker
    ports:
      - "32400:32400"
    volumes:
      - plex-config:/config
      - "${MEDIA_DIR:-$HOME/Media}:/media"
    networks:
      - local-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.localhost`)"
      - "traefik.http.routers.plex.entrypoints=web,websecure"
      - "traefik.http.routers.plex.tls=true"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: BentoPDF
  tailscale-pdf:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-pdf
    restart: unless-stopped
    profiles: ["remote", "all"]
    hostname: "pdf-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-pdf-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-pdf.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: Open WebUI
  tailscale-chat:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-chat
    restart: unless-stopped
    profiles: ["remote", "all"]
    hostname: "chat-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-chat-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-chat.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: Traefik Dashboard
  tailscale-traefik:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-traefik
    restart: unless-stopped
    profiles: ["remote", "all"]
    hostname: "traefik-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-traefik-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-traefik.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: Ollama LLM API
  tailscale-ollama:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-ollama
    restart: unless-stopped
    profiles: ["remote", "all"]
    hostname: "ollama-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-ollama-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-ollama.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: Kavita E-Books
  tailscale-books:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-books
    restart: unless-stopped
    profiles: ["remote", "all"]
    hostname: "books-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-books-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-books.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: Plex Media Server
  tailscale-plex:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-plex
    restart: unless-stopped
    profiles: ["remote", "media", "all"]
    hostname: "plex-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-plex-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-plex.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

  # 🌐 Tailscale Ingress: Remote Desktop Entrypoint (Port 443 TLS + Port 80 301 Redirect)
  tailscale-desktop:
    image: docker.io/tailscale/tailscale:latest
    container_name: local-tailscale-desktop
    restart: unless-stopped
    profiles: ["remote", "desktop", "all"]
    hostname: "desktop-${TS_MACHINE_ID}"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}
    volumes:
      - tailscale-desktop-state:/var/lib/tailscale
      - "${LOCAL_SERVICES_DIR:-$HOME/.local/share/local-services}/tailscale/serve-desktop.json:/config/serve.json:ro"
    networks:
      - local-mesh
    labels:
      - "io.containers.autoupdate=registry"

volumes:
  postgres-data:
  ollama-models:
  open-webui-data:
  ubooquity-data:
  plex-config:
  tailscale-pdf-state:
  tailscale-chat-state:
  tailscale-traefik-state:
  tailscale-ollama-state:
  tailscale-books-state:
  tailscale-plex-state:
  tailscale-desktop-state:



